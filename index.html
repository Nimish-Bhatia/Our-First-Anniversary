<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#191020"><title>Our First Year — Nimish & Nikhita</title><style>
:root{color-scheme:dark;font-family:Georgia,serif;background:#160e1d;color:#fff4e9}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#56314e 0%,#221428 46%,#100c17 100%);overflow-x:hidden}button{cursor:pointer;font:inherit}button:focus-visible{outline:3px solid #ffc6e2;outline-offset:3px}.hidden{display:none!important}.intro{min-height:100svh;display:grid;place-items:center;text-align:center;padding:32px 16px;position:relative}.intro-inner{animation:rise 1.5s both;max-width:650px}.eyebrow{letter-spacing:.3em;text-transform:uppercase;font:12px system-ui;color:#f9c4d6}.intro h1{font-size:clamp(36px,7vw,78px);line-height:1.05;margin:20px 0;background:linear-gradient(110deg,#fff7dc,#ffc3df,#ffdd9d);color:transparent;background-clip:text}.intro p{font-size:clamp(17px,2.5vw,23px);line-height:1.6;color:#f5dfe8}.cover{display:block;width:min(260px,60vw);margin:24px auto;border-radius:5px;box-shadow:0 22px 70px #000a;transform:rotate(-2deg);animation:float 5s ease-in-out infinite}.primary{border:1px solid #ffe4d5;background:linear-gradient(120deg,#d86d9c,#a34877);color:white;padding:15px 28px;border-radius:99px;box-shadow:0 7px 30px #e65b9d44}.secondary{border:1px solid #ffffff4a;background:#ffffff12;color:#fff4eb;padding:10px 16px;border-radius:99px}.reader{min-height:100svh;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px}.topbar{width:min(1560px,100%);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:clamp(16px,2vw,22px);font-weight:bold}.tools{display:flex;gap:8px;flex-wrap:wrap}.chapter{font:12px system-ui;letter-spacing:.18em;text-transform:uppercase;color:#f8bfd8;text-align:center}.book-area{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;flex:1;min-height:0}.nav{font:32px system-ui;border:1px solid #ffffff35;background:#ffffff15;color:white;width:48px;height:56px;border-radius:14px}.nav:disabled{opacity:.25;cursor:default}.book{position:relative;width:min(1560px,calc(100vw - 112px));height:calc(100svh - 205px);min-height:420px;display:flex;perspective:1800px;filter:drop-shadow(0 24px 30px #0009)}.sheet{width:50%;height:100%;background:#f6ebdb;padding:3px;overflow:hidden;border:1px solid #e7d6c4;box-shadow:inset 0 0 25px #0002}.sheet.left{border-radius:10px 0 0 10px;box-shadow:inset -15px 0 25px #0002}.sheet.right{border-radius:0 10px 10px 0;box-shadow:inset 15px 0 25px #0002}.sheet.empty{background:linear-gradient(120deg,#e8d5c2,#f7ecdc)}.sheet-inner{height:100%;width:100%;display:flex;flex-direction:column;gap:3px;justify-content:center}.sheet-inner img{display:block;min-height:0;min-width:0;width:100%;height:100%;object-fit:contain;background:#fff}.sheet-inner.multi{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:min-content;align-content:start;overflow:auto;scrollbar-width:thin;gap:3px;background:#f6ebdb}.sheet-inner.multi img{width:100%;height:auto;object-fit:contain;display:block;flex:none}.sheet-inner.multi.layout-2,.sheet-inner.multi.layout-3,.sheet-inner.multi.layout-5{grid-template-columns:1fr}.sheet-inner.multi.layout-3 img:nth-child(2),.sheet-inner.multi.layout-3 img:nth-child(3){width:100%}.sheet-inner.multi.layout-1{grid-template-columns:1fr 1fr}.sheet-inner.multi.layout-4{grid-template-columns:1fr}.sheet-inner.cover-page img{width:100%;height:100%;object-fit:contain}.sheet-inner.cover-page img{object-fit:contain}.sheet-inner.end-page{color:#47283a;text-align:center;padding:20px;align-items:center}.sheet-inner.end-page h2{font-size:clamp(22px,3vw,44px)}.sheet-inner.end-page p{font-size:clamp(15px,2vw,24px);line-height:1.5}.sheet-inner.end-page .primary{align-self:center}.flip-overlay{position:absolute;top:0;bottom:0;left:50%;width:50%;transform-origin:left center;background:linear-gradient(90deg,#e7d3c1,#fff5e8 35%,#f2dfcb);z-index:10;pointer-events:none;animation:turn .65s ease-in-out both;backface-visibility:hidden;box-shadow:0 0 25px #0006}.flip-overlay.reverse{left:0;transform-origin:right center;animation:turnBack .65s ease-in-out both}.timeline{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:1150px}.timeline button{font:11px system-ui;border:1px solid #ffffff36;color:#e7cbd8;background:#ffffff0c;border-radius:99px;padding:7px 10px}.timeline button.active{background:#a74779;color:white;border-color:#ef9fc5}.bottom{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;font:13px system-ui;color:#f0d4e0}.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}.heart{position:absolute;bottom:-30px;color:#ff9fc5;animation:heartsUp var(--dur) linear forwards;font-size:var(--size)}.progress{width:130px;height:5px;background:#ffffff30;border-radius:8px;overflow:hidden}.progress>div{height:100%;background:#e77ba9;transition:width .3s}@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}@keyframes float{50%{transform:translateY(-9px) rotate(1deg)}}@keyframes turn{0%{transform:rotateY(0);opacity:.9}100%{transform:rotateY(-180deg);opacity:0}}@keyframes turnBack{0%{transform:rotateY(0);opacity:.9}100%{transform:rotateY(180deg);opacity:0}}@keyframes heartsUp{to{transform:translateY(-110vh) rotate(45deg);opacity:0}}@media(max-width:750px){.book{width:min(100%,760px);height:calc(100svh - 215px);min-height:340px}.sheet{width:100%}.sheet.left{display:none}.sheet.right{border-radius:10px}.book-area{gap:4px}.nav{width:32px;height:48px;font-size:22px}.flip-overlay{left:0;width:100%}.timeline button{font-size:10px}.reader{padding:12px 6px}.sheet{padding:2px}.sheet-inner.multi{grid-template-columns:1fr 1fr}.sheet-inner.multi.layout-2,.sheet-inner.multi.layout-3,.sheet-inner.multi.layout-4,.sheet-inner.multi.layout-5{grid-template-columns:1fr}.brand{font-size:16px}}

/* One original illustration per turnable page. */
.sheet{padding:0;background:#17101c;border:0}
.sheet-inner{gap:0;background:#17101c}
.sheet-inner img,.sheet-inner.cover-page img{width:100%;height:100%;object-fit:contain;background:#17101c}
.sheet-inner.end-page{background:#f6ebdb}
.book{height:calc(100svh - 195px)}
@media(max-width:750px){.book{height:calc(100svh - 225px)}.sheet{padding:0}}

/* Separate, full-page chapter dividers before each chapter's illustrations. */
.chapter-title-page{position:relative;overflow:hidden;align-items:center;justify-content:center;text-align:center;padding:clamp(20px,5vw,70px);color:#fff4e9;background:radial-gradient(circle at 50% 30%,#925777 0%,#542f55 45%,#25152e 100%);border:8px solid #d9a77b;box-shadow:inset 0 0 0 2px #f7d5a8,inset 0 0 80px #140d1c}
.chapter-title-page:before,.chapter-title-page:after{content:'✦';position:absolute;font-size:clamp(22px,4vw,50px);color:#ffd6a8;opacity:.8}.chapter-title-page:before{top:7%;left:10%}.chapter-title-page:after{bottom:7%;right:10%}
.chapter-ornament{font-size:clamp(18px,3vw,35px);color:#ffd4a7;letter-spacing:.3em;margin-bottom:clamp(15px,4vh,42px)}
.chapter-number{font:600 clamp(12px,1.5vw,17px) system-ui;letter-spacing:.28em;color:#ffd6b5}
.chapter-title-page h2{font-size:clamp(27px,4.4vw,67px);line-height:1.14;max-width:650px;margin:clamp(16px,4vh,35px) 0;text-wrap:balance;text-shadow:0 4px 15px #13091c66}
.chapter-rule{height:2px;width:35%;max-width:180px;background:linear-gradient(90deg,transparent,#ffd4a7,transparent);margin:0 auto}
.chapter-title-page p{font-size:clamp(12px,1.6vw,18px);font-style:italic;color:#f8d6e6;margin-top:clamp(16px,4vh,35px)}
@media(max-width:750px){.chapter-title-page{border-width:5px;padding:18px}.chapter-title-page h2{font-size:clamp(26px,7vw,45px)}}
</style></head><body><main id="intro" class="intro"><div class="intro-inner"><div class="eyebrow">A little story, a lot of love</div><h1>Every love story has a beginning…</h1><p>Ours started with a simple hello.</p><img class="cover" src="assets/cover.webp" alt="Our First Year comic cover"><button id="open" class="primary">Open Our Story ♥</button></div></main><main id="reader" class="reader hidden"><header class="topbar"><div class="brand">Our First Year <span aria-hidden="true">♥</span></div><div class="tools"><button id="music" class="secondary" aria-pressed="false">♫ Play music</button><button id="sound" class="secondary" aria-pressed="true">♪ Page sound: On</button><button id="fullscreen" class="secondary">⛶ Fullscreen</button></div></header><div id="chapter" class="chapter" aria-live="polite"></div><section class="book-area" aria-label="Comic reader"><button id="prev" class="nav" aria-label="Previous page">‹</button><div id="book" class="book"><div id="left" class="sheet left"></div><div id="right" class="sheet right"></div></div><button id="next" class="nav" aria-label="Next page">›</button></section><nav id="timeline" class="timeline" aria-label="Chapter timeline"></nav><div class="bottom"><span id="counter"></span><div class="progress"><div id="bar"></div></div><span>← → to turn pages</span></div></main><div id="hearts" class="hearts" aria-hidden="true"></div><script>
const chapters=[
 {title:'Cover',short:'Cover',images:['cover']},
 {title:'The First Meeting at the Gym',short:'Gym',images:['p1-1','p1-2','p1-3','p1-4']},
 {title:'Our First Date at MKT',short:'First Date',images:['p2-1','p2-2','p2-3']},
 {title:'The Day We Made It Official',short:'Official',images:['p3-1','p3-2','p3-3','p3-4']},
 {title:'A Beautiful Escape Together',short:'Valley',images:['p4-1','p4-2']},
 {title:'Love by the Ocean',short:'Beach',images:['p5-1','p5-2','p5-3']},
 {title:'Happy Anniversary, Nikhita!',short:'Anniversary',images:['p6-1']}
];
const pages=chapters.flatMap((chapter,chapterIndex)=>[
 ...(chapterIndex===0?[]:[{chapterTitle:true,chapterIndex,chapter}]),
 ...chapter.images.map((image,panelIndex)=>({image,chapterIndex,panelIndex,chapter}))
]).concat([{ending:true,chapterIndex:7,chapter:{title:'Our Story Is Just Beginning',short:'Ending'}}]);
const $=id=>document.getElementById(id);let index=0,flipping=false,soundOn=true,musicOn=false,audioCtx,melodyTimer,beat=0;const isMobile=()=>matchMedia('(max-width:750px)').matches;
function page(i){if(i<0||i>=pages.length)return '';const p=pages[i];if(p.ending)return '<div class="sheet-inner end-page"><div style="font-size:50px">♥</div><h2>The End? Not even close.</h2><p>Our greatest adventures are still ahead.</p><button class="primary" onclick="replay()">↺ Replay Our Story</button></div>';if(p.chapterTitle)return '<div class="sheet-inner chapter-title-page"><div class="chapter-ornament">✦ ♥ ✦</div><div class="chapter-number">CHAPTER '+p.chapterIndex+' OF 6</div><h2>'+p.chapter.title+'</h2><div class="chapter-rule"></div><p>Our First Year · Nimish &amp; Nikhita</p></div>';return '<div class="sheet-inner cover-page"><img src="assets/'+p.image+'.webp" alt="'+p.chapter.title+', illustration '+(p.panelIndex+1)+'" draggable="false"></div>'}
function render(){const p=pages[index],leftIdx=isMobile()?-1:Math.max(0,index-1);$('left').innerHTML=leftIdx<0?'':page(leftIdx);$('left').classList.toggle('empty',leftIdx<0);$('right').innerHTML=page(index);$('chapter').textContent=p.ending?'THE NEXT CHAPTER · '+p.chapter.title:p.chapterIndex===0?'THE COVER':p.chapterTitle?`CHAPTER ${p.chapterIndex} OF 6 · ${p.chapter.title}`:`CHAPTER ${p.chapterIndex} OF 6 · ${p.chapter.title} · ILLUSTRATION ${p.panelIndex+1} OF ${p.chapter.images.length}`;$('counter').textContent=p.ending?'The End':`Page ${index+1} of ${pages.length-1}`;$('bar').style.width=((index+1)/pages.length*100)+'%';$('prev').disabled=index===0;$('next').disabled=index===pages.length-1;document.querySelectorAll('.timeline button').forEach((b,i)=>{const active=i===p.chapterIndex;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'step':'false')});try{localStorage.setItem('comic-chapter-pages-position',index)}catch(e){}if(p.ending)hearts()}
function flip(to){if(flipping||to===index||to<0||to>=pages.length)return;flipping=true;const overlay=document.createElement('div');overlay.className='flip-overlay'+(to<index?' reverse':'');$('book').appendChild(overlay);if(soundOn)pageSound();setTimeout(()=>{index=to;render()},320);setTimeout(()=>{overlay.remove();flipping=false},680)}
function replay(){flip(0)}window.replay=replay;function start(){$('intro').classList.add('hidden');$('reader').classList.remove('hidden');render()}$('open').onclick=()=>{start();hearts(14)};$('prev').onclick=()=>flip(index-1);$('next').onclick=()=>flip(index+1);document.addEventListener('keydown',e=>{if($('reader').classList.contains('hidden'))return;if(e.key==='ArrowRight')flip(index+1);if(e.key==='ArrowLeft')flip(index-1)});addEventListener('resize',render);chapters.forEach((c,i)=>{const b=document.createElement('button');b.textContent=i===0?'Cover':`0${i} · ${c.short}`;b.title=c.title;b.onclick=()=>flip(pages.findIndex(p=>p.chapterIndex===i));$('timeline').appendChild(b)});{const b=document.createElement('button');b.textContent='♥ Ending';b.onclick=()=>flip(pages.length-1);$('timeline').appendChild(b)}
function context(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}function tone(freq,dur,volume=0.025,type='sine',delay=0){let c=context(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.035);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.01)}function pageSound(){try{let c=context(),n=c.sampleRate*.23,buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);let src=c.createBufferSource(),filter=c.createBiquadFilter(),gain=c.createGain();src.buffer=buf;filter.type='lowpass';filter.frequency.value=850;gain.gain.value=.055;src.connect(filter).connect(gain).connect(c.destination);src.start()}catch(e){}}
$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent='♪ Page sound: '+(soundOn?'On':'Off');$('sound').setAttribute('aria-pressed',soundOn)};
function musicTick(){if(!musicOn)return;try{const notes=[261.63,329.63,392,523.25,392,329.63,293.66,349.23,440,587.33,440,349.23,246.94,329.63,392,493.88];tone(notes[beat%notes.length],1.6,.085,'sine');if(beat%4===0)tone(notes[beat%notes.length]/2,3,.038,'triangle');beat++}catch(e){}}
$('music').onclick=()=>{musicOn=!musicOn;$('music').textContent=musicOn?'♫ Pause music':'♫ Play music';$('music').setAttribute('aria-pressed',musicOn);if(musicOn){musicTick();melodyTimer=setInterval(musicTick,900)}else clearInterval(melodyTimer)};$('fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};function hearts(n=35){let holder=$('hearts');for(let i=0;i<n;i++){let h=document.createElement('span');h.className='heart';h.textContent='♥';h.style.left=Math.random()*100+'%';h.style.setProperty('--dur',(3+Math.random()*4)+'s');h.style.setProperty('--size',(12+Math.random()*24)+'px');h.style.animationDelay=(Math.random()*1.5)+'s';holder.appendChild(h);setTimeout(()=>h.remove(),9000)}}try{index=Math.max(0,Math.min(pages.length-1,Number(localStorage.getItem('comic-chapter-pages-position'))||0))}catch(e){}render();
</script></body></html>
